name: Rust
# Keep Actions usage low (user request; the repo is public, Windows bills 2x on private repos).
# PRs run Linux stable checks, a Linux Rust 1.88 test and a Windows stable test. The container
# and Windows reproducibility jobs run only by hand (workflow_dispatch); the testy end-to-end
# job runs by hand (on by default) and on pushes to main. Docs-only changes run
# nothing. See docs/development.md, "Continuous integration".
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "acpd/**"
      - "protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "scripts/build-testy.sh"
      - "tools/**"
      - "examples/*.json"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "acpd/**"
      - "protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "scripts/build-testy.sh"
      - "tools/**"
      - "examples/*.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
    inputs:
      extras:
        description: "Also run the platform jobs: container smoke (TLS, mounts, agent), Windows reproducibility on two runners, macOS tests"
        type: boolean
        default: false
      testy:
        description: "Run the testy end-to-end tests (builds the pinned rust-sdk testy agent)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  linux:
    name: Linux stable (fmt, clippy incl. Windows target, tests)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Windows lints on the cheap Linux runner; ring's build script needs the mingw C compiler.
      - name: Strict Clippy for the Windows target
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 >/dev/null
          cargo clippy --locked -p acpd --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Foreign-owned file replacement (Linux, sudo on the runner only)
        run: |
          set -eu
          ws="$(mktemp -d)"
          echo old > "$ws/foreign.txt"
          sudo chown 65534:65534 "$ws/foreign.txt"
          sudo chmod 0666 "$ws/foreign.txt"
          export ACPD_TEST_FOREIGN_FILE="$ws/foreign.txt"
          # As the runner user: refused, file and owner unchanged.
          cargo test --locked -p acpd --lib -- --ignored --exact filesystem::tests::unix_foreign_owned_target_is_refused_or_keeps_its_owner
          # As root: replaced, owner/group/mode kept. Run the built test binary, not cargo.
          bin="$(cargo test --locked -p acpd --lib --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "acpd" and (.target.kind | index("lib"))) | .executable')"
          sudo --preserve-env=ACPD_TEST_FOREIGN_FILE "$bin" --ignored --exact filesystem::tests::unix_foreign_owned_target_is_refused_or_keeps_its_owner
          stat -c '%u:%g %a' "$ws/foreign.txt"
          test "$(stat -c '%u:%g' "$ws/foreign.txt")" = 65534:65534

  minimum-rust:
    name: Linux Rust 1.88 (build and tests)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace --bins
      - run: cargo test --locked --workspace --all-targets

  windows:
    name: Windows stable (tests)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Clippy for this target runs on Linux (above); here only the real Windows tests.
      - run: cargo test --locked --workspace --all-targets

  testy:
    name: Linux testy end-to-end (pinned rust-sdk agent)
    # Manual runs (default on) and pushes to main; never on PRs.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACPD_TESTY_CACHE: ${{ github.workspace }}/../acpd-testy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pinned revision lives in scripts/build-testy.sh; hashing the script keys the cache.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../acpd-testy
          key: testy-${{ runner.os }}-${{ hashFiles('scripts/build-testy.sh') }}
      - name: Build testy
        run: echo "ACPD_TESTY_BIN=$(scripts/build-testy.sh)" >> "$GITHUB_ENV"
      - name: Run the testy tests
        run: bash scripts/run-testy-isolated.sh

  container:
    name: Container smoke (TLS, state mount, mock agent)
    if: github.event_name == 'workflow_dispatch' && inputs.extras
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build host image and the test-only smoke image
        run: |
          docker build --file docker/Dockerfile --tag acpd-ci .
          docker build --file docker/Dockerfile --target smoke --tag acpd-smoke .
      - name: Smoke check unprivileged production image
        run: |
          test "$(docker run --rm --entrypoint id acpd-ci -u)" = 10001
          docker run --rm acpd-ci --help
          docker run --rm acpd-ci --version
          # The mock agent exists only in the test image.
          docker run --rm --entrypoint sh acpd-ci -c 'test ! -e /usr/local/bin/mock-acp-agent'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet websockets==15.0.1
      - name: TLS, state/workspace mounts, pairing, agent execution and restart
        run: PYTHON=python bash scripts/container-smoke.sh

  windows-reproducibility:
    name: Windows reproducibility (${{ matrix.copy }})
    if: github.event_name == 'workflow_dispatch' && inputs.extras
    # Two independent runners and checkouts at different paths; each also compares two
    # clean builds of its own, and the next job compares the runners.
    strategy:
      fail-fast: false
      matrix:
        copy: [first-runner, second-runner]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: src-${{ matrix.copy }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Compare two clean release builds
        shell: pwsh
        working-directory: src-${{ matrix.copy }}
        run: ./scripts/verify-windows-reproducibility.ps1
      - name: Retain hash and toolchain evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-reproducibility-${{ matrix.copy }}
          path: src-${{ matrix.copy }}/reproducibility-evidence.txt
          if-no-files-found: error

  windows-reproducibility-compare:
    name: Windows reproducibility across runners
    needs: windows-reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-reproducibility-*
      - name: Same release executable hash on both runners
        run: |
          set -eu
          for copy in first-runner second-runner; do
            echo "== $copy"; cat "windows-reproducibility-$copy/reproducibility-evidence.txt"
          done
          a="$(sed -n 's/^First SHA256: //p' windows-reproducibility-first-runner/reproducibility-evidence.txt)"
          b="$(sed -n 's/^First SHA256: //p' windows-reproducibility-second-runner/reproducibility-evidence.txt)"
          test -n "$a" && test "$a" = "$b"
          echo "Both runners built acpd.exe with SHA256 $a"

  macos:
    name: macOS stable (tests incl. process cleanup and RSS)
    if: github.event_name == 'workflow_dispatch' && inputs.extras
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets
      - name: Process cleanup and RSS tests, named so a skip would show
        run: |
          cargo test --locked -p acpd --test lifecycle -- --exact unix_descendants_stop_on_session_removal_agent_crash_and_request_timeout --nocapture
          cargo test --locked -p acpd --test terminal -- --exact unix_terminal_kill_release_and_service_drop_stop_descendants --nocapture
          cargo test --locked -p acpd --test memory_rss -- --nocapture
