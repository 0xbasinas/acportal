name: Desktop redesign
# Electron desktop redesign (desktop-redesign/, a copy of desktop/). Linux only: typecheck, unit tests and the electron-vite
# build. No installers are built here; Windows/macOS packaging waits for an explicit go-ahead.
# Runs only when desktop-redesign/ or this file changes. It also runs on draft PRs because it is short.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "desktop-redesign/**"
      - ".github/workflows/desktop-redesign.yml"
  push:
    branches: [main]
    paths:
      - "desktop-redesign/**"
      - ".github/workflows/desktop-redesign.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-redesign
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-redesign/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # node unit tests, then Vitest component tests (jsdom)
      - run: npx electron-vite build
