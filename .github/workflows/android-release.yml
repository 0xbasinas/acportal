name: Release APK
# Builds the SIGNED release APK and publishes it as its own GitHub release (tag `app-v<version>`), next to
# the host/tray releases (`v<version>`) and the rolling `debug` pre-release. It never becomes the repository's
# "latest" release, because the install scripts read /releases/latest for the host and tray programs.
# By hand only: Actions -> "Release APK" -> Run workflow, with the app version (for example 0.1.3).
#
# Needs two repository secrets (never commit the key):
#   RELEASE_KEYSTORE_BASE64    the release keystore, base64 encoded (a .jks or .p12 file)
#   RELEASE_KEYSTORE_PASSWORD  its password (also used for the key unless RELEASE_KEY_PASSWORD is set)
# Optional: RELEASE_KEY_ALIAS (default `acportal`) and RELEASE_KEY_PASSWORD.
# Keep a private copy of the keystore: an installed app can only be updated by an APK signed with the same key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version without a leading v, for example 0.1.3"
        required: true
        type: string
      publish:
        description: "Publish the release (untick for a build-only test run)"
        required: true
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/universal-acp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the version and the signing secrets
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Version must look like 0.1.3 (no leading v), got: $INPUT_VERSION"; exit 1
          fi
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the repository secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD first (see the top of this workflow)."; exit 1
          fi
          major=$(printf '%s' "$INPUT_VERSION" | cut -d. -f1)
          minor=$(printf '%s' "$INPUT_VERSION" | cut -d. -f2)
          patch=$(printf '%s' "$INPUT_VERSION" | cut -d. -f3)
          # versionCode grows with the version: 0.1.3 -> 103, 1.2.3 -> 10203.
          code=$((major * 10000 + minor * 100 + patch))
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "file=acportal-$INPUT_VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Refuse to replace an existing release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.meta.outputs.tag }} already exists. Delete it first, or use a new version."; exit 1
          fi
      - name: Restore the release key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the signed release APK
        env:
          ACPORTAL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ACPORTAL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ACPORTAL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # An empty secret is passed as an empty variable; the build then uses its defaults.
          [ -n "$ACPORTAL_RELEASE_KEY_ALIAS" ] || unset ACPORTAL_RELEASE_KEY_ALIAS
          [ -n "$ACPORTAL_RELEASE_KEY_PASSWORD" ] || unset ACPORTAL_RELEASE_KEY_PASSWORD
          ./gradlew --stacktrace "-PacportalReleaseKeystore=$RUNNER_TEMP/release.keystore" \
            -PapkVersionCode=${{ steps.meta.outputs.code }} "-PapkVersionName=${{ steps.meta.outputs.version }}" \
            :app:assembleRelease
      - name: Verify the signature and name the files
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::No signed release APK was produced (is the signing key configured?)"; ls app/build/outputs/apk/release; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true\|Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/signature.txt"
          cp "$apk" "${{ steps.meta.outputs.file }}"
          sha256sum "${{ steps.meta.outputs.file }}" > "${{ steps.meta.outputs.file }}.sha256"
          cat "${{ steps.meta.outputs.file }}.sha256"
      - name: Keep the files from a test run
        if: "!inputs.publish"
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-test
          path: |
            android/universal-acp/${{ steps.meta.outputs.file }}
            android/universal-acp/${{ steps.meta.outputs.file }}.sha256
          retention-days: 3
      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.file }}" "${{ steps.meta.outputs.file }}.sha256" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "ACP Portal app ${{ steps.meta.outputs.version }}" \
            --notes "Signed release APK of the Android app, version ${{ steps.meta.outputs.version }} (versionCode ${{ steps.meta.outputs.code }}), built from ${GITHUB_SHA}. Install the attached .apk directly; the SHA-256 is in the .sha256 file. Updates install over this build only when signed with the same release key. See CHANGELOG.md for what changed."
