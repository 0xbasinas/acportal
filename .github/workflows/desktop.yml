name: Desktop
# Electron desktop client (desktop/). Linux only: typecheck, unit tests and the electron-vite
# build. No installers are built here; Windows/macOS packaging waits for an explicit go-ahead.
# Runs only when desktop/ or this file changes. It also runs on draft PRs because it is short.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
