name: Build APK
# Builds the debug APK and publishes it as the asset of one GitHub pre-release with a static tag
# (`debug`). Each run replaces that release, so the tag always points at the newest build and the
# download is the plain .apk, not a zipped workflow artifact. Debug build, no signing secrets.
# Runs on pushes to main that touch the app, and by hand: Actions -> "Build APK" -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/universal-acp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compute version
        id: version
        run: |
          short="${GITHUB_SHA::7}"
          code="${GITHUB_RUN_NUMBER}"
          name="0.1.0-debug.${GITHUB_RUN_NUMBER}+${short}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=acportal-debug-${GITHUB_RUN_NUMBER}-${short}.apk" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: ./gradlew --stacktrace -PapkVersionCode=${{ steps.version.outputs.code }} "-PapkVersionName=${{ steps.version.outputs.name }}" :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.file }}"
      - name: Publish the `debug` pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create debug "${{ steps.version.outputs.file }}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Debug build ${{ steps.version.outputs.name }}" \
            --notes "Debug APK (not signed for release) built from ${GITHUB_SHA} by run ${GITHUB_RUN_NUMBER}. Version ${{ steps.version.outputs.name }}, versionCode ${{ steps.version.outputs.code }}. Install the attached .apk directly."
