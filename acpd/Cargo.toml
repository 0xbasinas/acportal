[package]
name = "acpd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "acpd"

[dependencies]
acportal-protocol = { path = "../protocol" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# 1.27 requires Rust 1.89; preserve the workspace's declared Rust 1.88 minimum.
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
directories = "6"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
fs2 = "0.4"
cap-std = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "=0.14.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
rcgen = "0.14"

# Test-only: tests/memory_rss.rs reads the process working set on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "mock-acp-agent"
path = "src/bin/mock_acp_agent.rs"
