<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP Portal Screens</title>
<style>
:root{--bg:#0f0f11;--panel:#17171a;--line:#2a2a2f;--fg:#ededed;--mute:#8d8d95;--acc:#6ee7b7;}
@media (prefers-color-scheme:light){:root{--bg:#e9e9ec;--panel:#fff;--line:#d6d6dc;--fg:#18181b;--mute:#6b6b73;--acc:#047857;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
aside{width:320px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.top{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px}
#list{flex:1;overflow:auto;margin:0;padding:6px;list-style:none}
#list li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#list li:hover{background:var(--bg)}
#list li.on{background:var(--acc);color:#04130c}
#list small{margin-left:auto;color:var(--mute);flex:none}
#list li.on small{color:#04130c}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h1{font-size:14px;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
.stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;min-height:0}
.holder{flex:none;position:relative;box-shadow:0 8px 40px #0006;border-radius:6px;overflow:hidden}
iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;background:#fff}
.count{color:var(--mute);font-size:12px}
@media (max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .15s}body.menu aside{transform:none}}
</style>
</head>
<body>
<aside>
  <div class="top">
    <input id="q" type="search" placeholder="Search screens… (press /)" autocomplete="off">
    <div class="row">
      <select id="kind"><option value="">All sizes</option><option value="mobile">Mobile</option><option value="desktop">Desktop</option><option value="logo">Logos</option></select>
      <select id="theme"><option value="">Dark + light</option><option value="dark">Dark</option><option value="light">Light</option></select>
    </div>
    <div class="count" id="count"></div>
  </div>
  <ul id="list"></ul>
</aside>
<main>
  <div class="bar">
    <button id="menu" title="Show list">☰</button>
    <button id="prev" title="Previous (left arrow)">←</button>
    <button id="next" title="Next (right arrow)">→</button>
    <h1 id="title"></h1>
    <select id="fit" style="width:auto"><option value="fit">Fit</option><option value="1">100%</option></select>
    <button id="open" title="Open the file on its own">Open ↗</button>
  </div>
  <div class="stage" id="stage"><div class="holder" id="holder"><iframe id="frame" title="screen"></iframe></div></div>
</main>

}, {"f": "logo-light.html", "t": "logo-light", "w": 390, "h": 844, "theme": "light", "kind": "logo"}, {"f": "logo-mono-black.html", "t": "logo-mono-black", "w": 390, "h": 844, "theme": "", "kind": "logo"}, {"f": "logo-mono-white.html", "t": "logo-mono-white", "w": 390, "h": 844, "theme": "", "kind": "logo"}];
const $ = id => document.getElementById(id);
let view = ALL.slice(), cur = null;
function filter(){
  const q = $('q').value.trim().toLowerCase(), k = $('kind').value, t = $('theme').value;
  view = ALL.filter(i => (!q || i.t.toLowerCase().includes(q)) && (!k || i.kind === k) && (!t || i.theme === t));
  $('count').textContent = view.length + ' of ' + ALL.length + ' screens';
  $('list').innerHTML = '';
  view.forEach(i => {
    const li = document.createElement('li');
    li.textContent = i.t.replace(/\s*[\/–-]\s*(dark|light)$/i, '');
    li.dataset.f = i.f;
    const s = document.createElement('small'); s.textContent = i.theme || i.kind; li.appendChild(s);
    li.onclick = () => show(i);
    $('list').appendChild(li);
  });
  mark();
}
function mark(){
  document.querySelectorAll('#list li').forEach(li => li.classList.toggle('on', !!cur && li.dataset.f === cur.f));
  const on = document.querySelector('#list li.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function layout(){
  if (!cur) return;
  const st = $('stage'), pad = 40;
  const s = $('fit').value === 'fit' ? Math.min(1, (st.clientWidth - pad) / cur.w, (st.clientHeight - pad) / cur.h) : 1;
  const h = $('holder'); h.style.width = cur.w * s + 'px'; h.style.height = cur.h * s + 'px';
  const f = $('frame'); f.style.width = cur.w + 'px'; f.style.height = cur.h + 'px'; f.style.transform = 'scale(' + s + ')';
}
function show(i, push = true){
  cur = i; $('frame').src = i.f; $('title').textContent = i.t; document.title = i.t + ' · ACP Portal Screens';
  if (push) history.replaceState(null, '', '#' + i.f);
  document.body.classList.remove('menu'); layout(); mark();
}
function step(d){
  const n = view.findIndex(i => cur && i.f === cur.f);
  if (view.length) show(view[n < 0 ? 0 : (n + d + view.length) % view.length]);
}
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('menu').onclick = () => document.body.classList.toggle('menu');
$('open').onclick = () => cur && window.open(cur.f, '_blank');
['q','kind','theme'].forEach(id => $(id).addEventListener('input', filter));
$('fit').onchange = layout; addEventListener('resize', layout);
addEventListener('keydown', e => {
  if (e.target.matches('input,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
});
addEventListener('hashchange', () => { const i = ALL.find(i => '#' + i.f === location.hash); if (i && (!cur || cur.f !== i.f)) show(i, false); });
filter();
show(ALL.find(i => '#' + i.f === location.hash) || ALL[0], false);
</script>
